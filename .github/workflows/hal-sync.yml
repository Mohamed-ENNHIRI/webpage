# Met à jour la liste des publications depuis HAL.
#
# Tourne chaque matin. Les deux scripts n'utilisent que Node, sans aucune
# dépendance à installer. Quand HAL n'a rien de neuf, les fichiers restent
# identiques au bit près : aucun commit n'est fait et le site ne se republie
# pas, ce qui garde un historique lisible.

name: Mettre à jour les publications depuis HAL

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Lire HAL
        run: node tools/hal.mjs

      - name: Récupérer l'image de première page des nouveaux dépôts
        run: node tools/thumbnails.mjs

      - name: Enregistrer si quelque chose a changé
        run: |
          if git diff --quiet -- data/publications.json img/publications; then
            echo "Rien de neuf dans HAL."
            exit 0
          fi
          COUNT=$(node -e "console.log(require('./data/publications.json').count)")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json img/publications
          git commit -m "Publications mises à jour depuis HAL (${COUNT} références)"
          git push
