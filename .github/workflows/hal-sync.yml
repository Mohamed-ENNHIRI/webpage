# Refresh the publication list from HAL.
#
# Runs every morning. When HAL has nothing new the script leaves the file
# byte-identical, so no commit is made and no deploy is triggered — the repo
# history stays meaningful rather than filling with daily noise.

name: Update publications from HAL

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Read HAL
        run: node build/hal.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/publications.json; then
            echo "No change in HAL."
            exit 0
          fi
          COUNT=$(node -e "console.log(require('./data/publications.json').count)")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          git commit -m "Update publications from HAL (${COUNT} records)"
          git push
