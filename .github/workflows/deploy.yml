# Publie le site sur GitHub Pages.
#

name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# On laisse une publication en cours se terminer plutôt que de l'interrompre.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Signale une phrase qui s'écarte du style du site, sans jamais bloquer :
      # une tournure maladroite ne doit pas empêcher une correction de paraître.
      - name: Style
        run: node tools/style-check.mjs
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
